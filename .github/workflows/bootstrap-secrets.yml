name: Bootstrap Production Secrets

# One-time (or occasional) manual setup step: generates and sets the SST
# secrets this app needs (PatientSessionSecret, SignatureSessionSecret,
# AdminSessionSecret, AdminUser, AdminPasswordHash) for the "production"
# stage. These were never set after this stage was first created — `npx
# sst secret list --stage production` returned "No secrets found" — which
# silently disabled the patient/provider document-upload portal and the
# admin panel without any visible error (see lib/phiAuth.ts's
# isPatientPortalConfigured() and lib/adminAuth.ts's getSecret()).
#
# Runs on a GitHub-hosted runner instead of AWS CloudShell deliberately:
# CloudShell's persistent storage is a hard 1 GB/region quota (not
# increasable — see AWS's CloudShell docs), and `sst`'s own Pulumi/bun
# binaries alone are ~870 MB, which repeatedly filled CloudShell's disk
# before `sst secret set` could even run. A GitHub Actions runner has
# ~14 GB of disk and already has this repo's AWS credentials configured
# (same secrets.AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY as deploy.yml),
# so it has everything this needs without touching CloudShell at all.
#
# IMPORTANT: re-running this ROTATES every secret below, which signs out
# every existing admin session and invalidates any already-sent magic
# links. Only re-run it if you actually want to reset the admin password
# or rotate these secrets — not as a routine step.
#
# After running: re-run "Deploy to Production" (a fresh Run workflow) so
# the new secret values actually reach the live Lambda — SST only bakes a
# secret's value into the function at deploy time, not retroactively.

on:
  workflow_dispatch:
    inputs:
      admin_user:
        description: "Admin panel username (e.g. your email or a short handle). The password is generated automatically and printed once in this run, in the log below — copy it from there and sign in at /admin/login, then consider changing it via /admin/change-password."
        required: true
        type: string

jobs:
  bootstrap-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The last step prints the generated admin password into this run's
      # log. On a PUBLIC repository Actions logs are readable by anyone on
      # the internet, so refuse to run at all unless the repo is private.
      - name: Refuse to run on a public repository
        if: ${{ github.event.repository.private != true }}
        run: |
          echo "::error title=Repository is public::This workflow prints the admin password to the run log, which is world-readable on a public repo. Make the repository private (Settings > General > Danger Zone > Change visibility) and run it again."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Generate admin password + hash
        id: admin
        run: |
          node -e "
          const { randomBytes, scryptSync } = require('crypto');
          const password = randomBytes(12).toString('base64url');
          const salt = randomBytes(16);
          const hash = scryptSync(password, salt, 64);
          const hashStr = 'scrypt\$' + salt.toString('hex') + '\$' + hash.toString('hex');
          console.log('password=' + password);
          console.log('hash=' + hashStr);
          " >> "$GITHUB_OUTPUT"

      - name: Set PatientSessionSecret
        run: npx sst secret set PatientSessionSecret "$(openssl rand -hex 32)" --stage production

      - name: Set SignatureSessionSecret
        run: npx sst secret set SignatureSessionSecret "$(openssl rand -hex 32)" --stage production

      - name: Set AdminSessionSecret
        run: npx sst secret set AdminSessionSecret "$(openssl rand -hex 32)" --stage production

      - name: Set AdminUser
        # Single-quoted deliberately: GitHub substitutes ${{ inputs.admin_user }}
        # into this line as plain text BEFORE bash ever sees it, and the
        # generated hash below contains literal "$" characters (scrypt$<salt>$<hash>)
        # that double quotes would make bash try to expand as variables,
        # silently truncating the value. Single quotes pass it through as-is.
        run: npx sst secret set AdminUser '${{ inputs.admin_user }}' --stage production

      - name: Set AdminPasswordHash
        run: npx sst secret set AdminPasswordHash '${{ steps.admin.outputs.hash }}' --stage production

      - name: Print the generated admin password (ONLY place it's shown)
        run: |
          echo "::notice title=Admin login::Username: ${{ inputs.admin_user }}  |  Password: ${{ steps.admin.outputs.password }}  (copy this now — it is not stored anywhere and won't be shown again; this run's log is only visible to people with access to this repo)"
